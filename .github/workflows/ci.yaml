name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: app
        run: pytest -q
      - name: Build container image
        run: docker build -t platform-health-api:ci -f app/Dockerfile .
